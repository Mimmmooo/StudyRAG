<text x="530" y="120" font-size="46" font-weight="750" fill="#f7f7f7">📚 StudyRAG</text>
<text x="532" y="160" font-size="15" fill="#9e9e9e">Study your own notes with local retrieval and page citations.</text>
<rect x="530" y="184" width="760" height="63" rx="10" fill="#1d1d21"/>
<rect x="547" y="202" width="32" height="32" rx="9" fill="#f09fa9"/>
<text x="563" y="224" font-size="19" text-anchor="middle">☺</text>
<text x="595" y="222" font-size="16" fill="#f6f6f6">What does ChromaDB store?</text>
<rect x="547" y="277" width="32" height="32" rx="9" fill="#eea56d"/>
<text x="563" y="300" font-size="19" text-anchor="middle">♟</text>
<text x="595" y="299" font-size="16" fill="#f6f6f6">ChromaDB stores vectors and lets us search for similar passages. [1]</text>
<rect x="595" y="327" width="695" height="42" rx="8" fill="none" stroke="#4c4a4b"/>
<text x="612" y="353" font-size="14" fill="#e8e8e8">›   [1] sample_notes.txt · page 1</text>
<rect x="530" y="400" width="760" height="63" rx="10" fill="#1d1d21"/>
<rect x="547" y="418" width="32" height="32" rx="9" fill="#f09fa9"/>
<text x="563" y="440" font-size="19" text-anchor="middle">☺</text>
<text x="595" y="440" font-size="16" fill="#f6f6f6">What are those vectors used for?</text>
<rect x="547" y="493" width="32" height="32" rx="9" fill="#eea56d"/>
<text x="563" y="516" font-size="19" text-anchor="middle">♟</text>
<text x="595" y="514" font-size="15" fill="#f3f3f3">Those vectors represent text numerically so ChromaDB can</text>
<text x="595" y="541" font-size="15" fill="#f3f3f3">search for and retrieve passages similar to the query. [1]</text>
<rect x="595" y="565" width="695" height="42" rx="8" fill="none" stroke="#4c4a4b"/>
<text x="612" y="591" font-size="14" fill="#e8e8e8">›   [1] sample_notes.txt · page 1</text>
